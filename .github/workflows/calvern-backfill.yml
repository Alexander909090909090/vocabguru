# Regenerates stale word profiles and works through the word queue by calling the calvern-backfill
# edge function once per word (short calls stay inside the edge-function time limit). Idles when done.
# Needs one repository secret: SUPABASE_SERVICE_ROLE_KEY.
name: calvern-backfill

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      words:
        description: "Words to process this run (1-30)"
        default: "6"

concurrency:
  group: calvern-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Process words one at a time
        env:
          SUPABASE_URL: https://pivvbookarqnqynfmaxc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORDS: ${{ github.event.inputs.words || '6' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not set"; exit 1
          fi
          for i in $(seq 1 "$WORDS"); do
            status=$(curl -sS -o response.json -w "%{http_code}" --max-time 160 \
              -X POST "$SUPABASE_URL/functions/v1/calvern-backfill" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"limit": 1}') || status=000
            echo "[$i/$WORDS] HTTP $status $(cat response.json 2>/dev/null)"
            # Nothing left to do: stop early.
            if [ "$status" = "200" ] && grep -q '"processed":0' response.json; then echo "All words current."; break; fi
            sleep 4
          done

